name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: layout and no-public-grade check
        run: python tests/test_smoke.py
      - name: full unit test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: rerun the three level runners and the guard corpus
        run: |
          python level-1-learn/run_learn.py
          python level-2-build/run_build.py
          python level-3-deep/run_deep.py
          python level-3-deep/guard_corpus.py
      - name: committed results must be reproduced byte for byte
        run: git diff --exit-code -- level-1-learn level-2-build level-3-deep
